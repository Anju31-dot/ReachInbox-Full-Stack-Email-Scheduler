# Optional Render Blueprint. After sync, set FRONTEND_URL, Google OAuth, Ethereal SMTP, and Slack in the dashboard.
services:
  - type: web
    name: reachinbox-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_WORKER
        value: "false"
      - key: ENABLE_HTTP
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: reachinbox-redis
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: ETHEREAL_USER
        sync: false
      - key: ETHEREAL_PASS
        sync: false

  - type: worker
    name: reachinbox-worker
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_HTTP
        value: "false"
      - key: ENABLE_WORKER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: reachinbox-redis
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        fromService:
          type: web
          name: reachinbox-api
          envVarKey: JWT_SECRET
      - key: ETHEREAL_USER
        sync: false
      - key: ETHEREAL_PASS
        sync: false

  - type: keyvalue
    name: reachinbox-redis
    plan: free
    ipAllowList: []

databases:
  - name: reachinbox-postgres
    plan: free
    databaseName: reachinbox_db
