# Optional Render Blueprint. After sync, set Google OAuth and Ethereal SMTP credentials in the dashboard.
services:
  - type: web
    name: reachinbox-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run prisma:migrate:deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_WORKER
        value: "true"
      - key: ENABLE_HTTP
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: reachinbox-redis
          property: connectionString
      - key: FRONTEND_URL
        value: https://reach-inbox-full-stack-email-schedu.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://reachinbox-api-1zw9.onrender.com/api/auth/google/callback
      - key: ETHEREAL_USER
        sync: false
      - key: ETHEREAL_PASS
        sync: false

  - type: keyvalue
    name: reachinbox-redis
    plan: free
    ipAllowList: []

databases:
  - name: reachinbox-postgres
    plan: free
    databaseName: reachinbox_db
